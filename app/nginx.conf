# =================================================================
# nginx.conf — DevOps Observability Project
# Security-hardened configuration
# =================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;  #warn means only log warnings and above — not debug noise. This file is what CloudWatch Agent reads to detect crashes.
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {

    include       /etc/nginx/mime.types;   # Nginx sends every file as application/octet-stream (binary download). With it, .html gets text/html, .css gets text/css, browser renders them correctly.
    default_type  application/octet-stream;  #For any file type NOT in mime.types — treat it as a binary download. Safe fallback.

    # -----------------------------------------------------------------
    # SECURITY: Hide Nginx version from response headers
    # Default behaviour advertises "nginx/1.25.3" — gives attacker
    # a free shortcut to version-specific CVEs
    # -----------------------------------------------------------------
    server_tokens  off;     # off makes it just say Server: nginx. One line, removes a free attack vector.

    # -----------------------------------------------------------------
    # SECURITY: Timeout settings — prevent slow loris attacks
    # Slow loris = attacker opens many connections, sends data very
    # slowly, holds your worker connections hostage until server dies
    # -----------------------------------------------------------------
    client_body_timeout    10s;
    client_header_timeout  10s;
    keepalive_timeout      65s;     #Reduces overhead of opening new connections for every resource.
    send_timeout           10s;

    # -----------------------------------------------------------------
    # SECURITY: Limit request body size
    # Prevents someone sending a 500MB POST to crash t2.micro
    # Static site needs no large uploads — 1MB is generous
    # -----------------------------------------------------------------
    client_max_body_size  1m;   

    # -----------------------------------------------------------------
    # LOGGING: Structured format for CloudWatch Agent parsing
    # Every field is labelled — CloudWatch metric filters need this
    # rt= prefix on request_time allows easy grep/filter in CloudWatch
    # -----------------------------------------------------------------
    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile  on;

    # -----------------------------------------------------------------
    # SECURITY: Rate limiting
    # Defines a zone called "general" — tracks IPs, allows 10 req/sec
    # Protects t2.micro from being overwhelmed
    # -----------------------------------------------------------------
    limit_req_zone  $binary_remote_addr  zone=general:10m  rate=10r/s;

    server {
        listen       80;   #IPv4
        listen  [::]:80;        # IPv6 
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # -------------------------------------------------------------
        # SECURITY: Add headers to every response
        # These instruct the browser on security boundaries
        # -------------------------------------------------------------

        # Prevents your page being loaded inside an iframe (clickjacking)
        add_header  X-Frame-Options  "SAMEORIGIN"  always;

        # Stops browser from guessing file types (MIME sniffing attacks)
        add_header  X-Content-Type-Options  "nosniff"  always;

        # Tells browser not to send referrer info to other sites
        add_header  Referrer-Policy  "no-referrer-when-downgrade"  always;

        # Restricts what resources the page can load
        # self = only from your own domain, no external scripts allowed
        add_header  Content-Security-Policy  "default-src 'self'; style-src 'self' 'unsafe-inline';"  always;

        # -------------------------------------------------------------
        # SECURITY: Only allow GET and HEAD
        # Static site never needs POST, DELETE, PUT
        # Return 405 for anything else
        # -------------------------------------------------------------
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        # -------------------------------------------------------------
        # SECURITY: Block access to hidden files (.env, .git, etc.)
        # If someone types yourip/.env — return 404, not the file
        # -------------------------------------------------------------
        location ~ /\. {
            deny  all;
            return 404;
        }

        # -------------------------------------------------------------
        # Main route — serves dashboard with rate limiting applied
        # burst=20 = allows short spikes of 20 requests above the limit
        # nodelay = don't queue them, just serve or reject immediately
        # -------------------------------------------------------------
        location / {
            limit_req  zone=general  burst=20  nodelay;
            try_files  $uri $uri/ /index.html;
        }

        # -------------------------------------------------------------
        # /health endpoint — MTTD measurement point
        # health-check.sh polls this every 30 seconds
        # 200 = alive, no response = failure detected, MTTD clock starts
        # No rate limit here — health checks must always get through
        # access_log off — don't pollute logs with 2880 pings/day
        # -------------------------------------------------------------
        location /health {
            access_log  off;
            return 200  'healthy\n';
            add_header  Content-Type text/plain;
        }

        # -------------------------------------------------------------
        # Custom error pages
        # -------------------------------------------------------------
        error_page  500 502 503 504  /50x.html;
        location = /50x.html {
            root  /usr/share/nginx/html;
        }
    }
}